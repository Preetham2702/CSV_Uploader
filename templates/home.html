<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #ffffff;
      margin-top: 100px;
    }

    .button-container {
      display: flex;
      justify-content: center;
      gap: 20px; /* space between buttons */
    }

    .nav-button {
      padding: 15px 30px;
      font-size: 18px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .nav-button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <div class="button-container">
    <form action="{{ url_for('operator_data') }}">
      <button class="nav-button" type="submit">Operator Data</button>
    </form>

    <form action="{{ url_for('sensor3_data') }}">
      <button class="nav-button" type="submit">Sensor3 Data</button>
    </form>
  </div>

</body>
</html>
