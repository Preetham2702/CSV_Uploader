<!DOCTYPE html>
<html>
<head>
  <title>Secure Access</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f0f2f5;
      margin: 0;
      padding: 0;
    }

    .access-btn {
      margin-top: 200px;
      padding: 20px 40px;
      font-size: 20px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .access-btn:hover {
      background-color: #0056b3;
    }

    .otp-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 999;
    }

    .otp-content {
      background-color: white;
      margin: 10% auto;
      padding: 40px 30px;
      width: 400px;
      max-width: 90%;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    .otp-boxes {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: nowrap;
    }

    .otp-input {
      width: 45px;
      height: 50px;
      font-size: 24px;
      text-align: center;
      border: 2px solid #ccc;
      border-radius: 6px;
    }

    .otp-input:focus {
      outline: none;
      border-color: #007bff;
      box-shadow: 0 0 5px rgba(0,123,255,0.5);
    }

    .submit-btn {
      padding: 12px 30px;
      font-size: 18px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .submit-btn:hover {
      background-color: #218838;
    }

    .error-msg {
      color: red;
      margin-bottom: 15px;
    }
  </style>

  <script>
    function showPINModal() {
      document.getElementById('otpModal').style.display = 'block';
      document.getElementById('digit0').focus();
    }

    function focusNext(elem, nextId) {
      if (elem.value.length === 1 && nextId) {
        document.getElementById(nextId).focus();
      }
    }

    function focusPrev(event, prevId) {
      if (event.inputType === "deleteContentBackward" && prevId) {
        document.getElementById(prevId).focus();
      }
    }
  </script>
</head>
<body>

  <button class="access-btn" onclick="showPINModal()">Access</button>

  <div class="otp-modal" id="otpModal">
    <div class="otp-content">
      <h3>Enter 4-digit Access PIN</h3>
      {% if error %}
        <p class="error-msg">{{ error }}</p>
      {% endif %}
      <form method="POST" action="{{ url_for('enter_pin') }}">
        <div class="otp-boxes">
          <input type="text" name="digit0" id="digit0" class="otp-input" maxlength="1"
            oninput="focusNext(this, 'digit1')" onkeydown="focusPrev(event, null)" required>
          <input type="text" name="digit1" id="digit1" class="otp-input" maxlength="1"
            oninput="focusNext(this, 'digit2')" onkeydown="focusPrev(event, 'digit0')" required>
          <input type="text" name="digit2" id="digit2" class="otp-input" maxlength="1"
            oninput="focusNext(this, 'digit3')" onkeydown="focusPrev(event, 'digit1')" required>
          <input type="text" name="digit3" id="digit3" class="otp-input" maxlength="1"
            oninput="focusNext(this, null)" onkeydown="focusPrev(event, 'digit2')" required>
        </div>
        <button class="submit-btn" type="submit">Submit</button>
      </form>
    </div>
  </div>

</body>
</html>
