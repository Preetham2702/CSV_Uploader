<!DOCTYPE html>
<html>
<head>
  <title>Secure Access</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f0f2f5;
    }

    .logo {
      margin-top: 80px;
    }

    .logo img {
      height: 300px;
    }

    .access-btn {
      margin-top: 40px;
      padding: 20px 40px;
      font-size: 20px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .access-btn:hover {
      background-color: #0056b3;
    }

    .otp-modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
    }

    .otp-content {
      background-color: white;
      margin: 10% auto;
      padding: 40px;
      width: 350px;
      border-radius: 10px;
    }

    .otp-input {
      width: 40px;
      height: 40px;
      margin: 5px;
      font-size: 24px;
      text-align: center;
    }

    .submit-btn {
      margin-top: 20px;
      padding: 12px 30px;
      font-size: 18px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 5px;
    }

    .error-msg {
      color: red;
      margin-top: 10px;
    }
  </style>

  <script>
    function showPINModal() {
      document.getElementById('otpModal').style.display = 'block';
      setTimeout(() => document.getElementById('digit0').focus(), 100);
    }

    function focusNext(elem, nextId) {
      if (elem.value.length === 1 && nextId) {
        document.getElementById(nextId).focus();
      }
    }
  </script>

  {% if error %}
  <script>
    window.onload = function () {
      showPINModal();
    };
  </script>
  {% endif %}
</head>
<body>

  <div class="logo">
    <img src="{{ url_for('static', filename='images/lamp_logo.png') }}" alt="LAMP Logo">
  </div>

  <button class="access-btn" onclick="showPINModal();">Access</button>

  <div class="otp-modal" id="otpModal">
    <div class="otp-content">
      <h3>Enter 4-digit Access PIN</h3>
      {% if error %}
        <p class="error-msg">{{ error }}</p>
      {% endif %}
      <form method="POST" action="{{ url_for('verify_pin') }}">
        {% for i in range(4) %}
          <input type="text" name="digit{{i}}" id="digit{{i}}" class="otp-input" maxlength="1"
                 oninput="focusNext(this, 'digit{{i+1}}')" required>
        {% endfor %}
        <br>
        <button class="submit-btn" type="submit">Submit</button>
      </form>
    </div>
  </div>

</body>
</html>
